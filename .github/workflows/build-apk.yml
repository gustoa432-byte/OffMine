name: Build Offline AI Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Setup Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Clean Poisoned Lockfiles & Install NPM Packages
        run: |
          rm -rf android dist node_modules package-lock.json bun.lock babel.config.js metro.config.js index.js app.json
          npm install --no-package-lock --legacy-peer-deps

      - name: 5. Build Production Web Bundle (Vite)
        run: npm run build

      - name: 6. Generate Native Android Project via Capacitor
        run: |
          npx cap add android
          npx cap sync android

      - name: 7. Enable Multi-Thread SharedArrayBuffer (COOP/COEP) & LargeHeap in Android
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application/<application android:largeHeap="true" android:usesCleartextTraffic="true"/g' "$MANIFEST"
          fi
          echo "" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> android/gradle.properties

          node -e '
            const fs = require("fs");
            const file = "node_modules/@capacitor/android/capacitor/src/main/java/com/getcapacitor/WebViewLocalServer.java";
            if (fs.existsSync(file)) {
              let code = fs.readFileSync(file, "utf8");
              const headersBlock = `responseHeaders.put("Cross-Origin-Opener-Policy", "same-origin");\n        responseHeaders.put("Cross-Origin-Embedder-Policy", "credentialless");\n        responseHeaders.put("Cross-Origin-Resource-Policy", "cross-origin");`;
              
              if (code.includes(`tempResponseHeaders.put("Cache-Control", "no-cache");`)) {
                code = code.replace(
                  `tempResponseHeaders.put("Cache-Control", "no-cache");`,
                  `tempResponseHeaders.put("Cache-Control", "no-cache");\n            tempResponseHeaders.put("Cross-Origin-Opener-Policy", "same-origin");\n            tempResponseHeaders.put("Cross-Origin-Embedder-Policy", "credentialless");\n            tempResponseHeaders.put("Cross-Origin-Resource-Policy", "cross-origin");`
                );
              }
              code = code.replace(
                /this\.responseHeaders\s*=\s*new\s+HashMap<>\(\);/g,
                `this.responseHeaders = new HashMap<>();\n            this.${headersBlock.replace(/responseHeaders/g, "responseHeaders")}`
              );
              code = code.replace(
                /Map<String,\s*String>\s+responseHeaders\s*=\s*handler\.getResponseHeaders\(\);/g,
                `Map<String, String> responseHeaders = new HashMap<>(handler.getResponseHeaders());\n        ${headersBlock}`
              );
              fs.writeFileSync(file, code, "utf8");
              console.log("Patched WebViewLocalServer.java successfully!");
            }
          '

      - name: 8. Build Signed Installable APK via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 9. Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketCore-Offline-AI-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
